openapi: 3.0.3
info: {title: Clean Library API, version: 1.0.0, description: A small API with authentication on every operation and no sensitive fields.}
servers: [{url: https://api.example.com/v1}]
security: [{bearerAuth: []}]
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  responses:
    Unauthorized: {description: Missing or invalid token}
    Forbidden: {description: Not allowed}
    TooMany: {description: Rate limit exceeded, headers: {Retry-After: {schema: {type: integer}}}}
  schemas:
    Book:
      type: object
      properties:
        title: {type: string, maxLength: 100}
        pages: {type: integer, format: int32, minimum: 1, maximum: 5000}
paths:
  /books:
    get:
      summary: List books
      description: Returns a page of books.
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: A list of books, content: {application/json: {schema: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/Book'}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooMany'}
  /books/{bookId}:
    get:
      summary: Get one book
      description: Returns one book.
      parameters: [{name: bookId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: A book, content: {application/json: {schema: {$ref: '#/components/schemas/Book'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooMany'}
