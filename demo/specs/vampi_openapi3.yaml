# VAmPI -- Vulnerable API, OpenAPI 3 specification.
# Source: https://github.com/erev0s/VAmPI (openapi_specs/openapi3.yml)
# Used in APIGUARD as ground-truth corpus L3 and as the S0 demo input.
openapi: 3.0.1
info:
  title: VAmPI
  description: OpenAPI v3 specs for VAmPI
  version: '0.1'
servers:
  - url: http://localhost:5000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      x-bearerInfoFunc: models.user_model.User.decode_auth_token
paths:
  /createdb:
    get:
      tags: [db-init]
      summary: Creates and populates the database with dummy data
      description: Creates and populates the database with dummy data
      operationId: api_views.main.populate_db
      responses:
        '200':
          description: Creates and populates the database with dummy data
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: 'Database populated.'}
  /:
    get:
      tags: [home]
      summary: VAmPI home
      description: VAmPI is a vulnerable on purpose API.
      operationId: api_views.main.basic
      responses:
        '200':
          description: Home - Help
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string, example: 'VAmPI the Vulnerable API'}
                  help: {type: string}
                  vulnerable: {type: number, example: 1}
  /users/v1:
    get:
      tags: [users]
      summary: Retrieves all users
      description: Displays all users with basic information
      operationId: api_views.users.get_all_users
      responses:
        '200':
          description: See basic info about all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        email: {type: string, example: 'mail1@mail.com'}
                        username: {type: string, example: 'name1'}
  /users/v1/_debug:
    get:
      tags: [users]
      summary: Retrieves all details for all users
      description: Displays all details for all users
      operationId: api_views.users.debug
      responses:
        '200':
          description: See all details of the users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        admin: {type: boolean, example: false}
                        email: {type: string, example: 'mail1@mail.com'}
                        password: {type: string, example: 'pass1'}
                        username: {type: string, example: 'name1'}
  /users/v1/register:
    post:
      tags: [users]
      summary: Register new user
      description: Register new user
      operationId: api_views.users.register_user
      requestBody:
        description: Username of the user
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, example: 'name1'}
                password: {type: string, example: 'pass1'}
                email: {type: string, example: 'user@tempmail.com'}
      responses:
        '200':
          description: Successfully created user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  status: {type: string, enum: ['success', 'fail']}
        '400':
          description: Invalid request
          content: {}
  /users/v1/login:
    post:
      tags: [users]
      summary: Login to VAmPI
      description: Login to VAmPI
      operationId: api_views.users.login_user
      requestBody:
        description: Username of the user
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username: {type: string, example: 'name1'}
                password: {type: string, example: 'pass1'}
      responses:
        '200':
          description: Sucessfully logged in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth_token: {type: string}
                  message: {type: string}
                  status: {type: string, enum: ['success', 'fail']}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
  /me:
    get:
      security:
        - bearerAuth: []
      tags: [users]
      summary: Retrieves currently logged in user
      description: Displays information about the currently authenticated user
      operationId: api_views.users.me
      responses:
        '200':
          description: Display current user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      admin: {type: boolean, example: false}
                      email: {type: string, example: 'mail1@mail.com'}
                      username: {type: string, example: 'name1'}
                  status: {type: string, example: 'success'}
        '401':
          description: Unauthorized access due to expired, invalid, or missing token
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  message: {type: string}
  /users/v1/{username}:
    get:
      tags: [users]
      summary: Retrieves user by username
      description: Displays user by username
      operationId: api_views.users.get_by_username
      parameters:
        - name: username
          in: path
          description: retrieve username data
          required: true
          schema: {type: string, example: 'name1'}
      responses:
        '200':
          description: Successfully display user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: {type: string, example: 'name1'}
                  email: {type: string, example: 'mail1@mail.com'}
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
    delete:
      security:
        - bearerAuth: []
      tags: [users]
      summary: Deletes user by username (Only Admins)
      description: Deletes user by username (Only Admins)
      operationId: api_views.users.delete_user
      parameters:
        - name: username
          in: path
          description: Delete username
          required: true
          schema: {type: string, example: 'name1'}
      responses:
        '200':
          description: Successfully deleted user
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  status: {type: string, enum: ['success', 'fail']}
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
        '404':
          description: User not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
  /users/v1/{username}/email:
    put:
      security:
        - bearerAuth: []
      tags: [users]
      summary: Update users email
      description: Update a single users email
      operationId: api_views.users.update_email
      parameters:
        - name: username
          in: path
          description: username to update email
          required: true
          schema: {type: string, example: 'name1'}
      requestBody:
        description: field to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: {type: string, example: 'mail3@mail.com'}
      responses:
        '204':
          description: Successfully updated user email
          content: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
  /users/v1/{username}/password:
    put:
      security:
        - bearerAuth: []
      tags: [users]
      summary: Update users password
      description: Update users password
      operationId: api_views.users.update_password
      parameters:
        - name: username
          in: path
          description: username to update password
          required: true
          schema: {type: string, example: 'name1'}
      requestBody:
        description: field to update
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: {type: string, example: 'pass4'}
      responses:
        '204':
          description: Successfully updated users password
          content: {}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
  /books/v1:
    get:
      tags: [books]
      summary: Retrieves all books
      description: Retrieves all books
      operationId: api_views.books.get_all_books
      responses:
        '200':
          description: See all books
          content:
            application/json:
              schema:
                type: object
                properties:
                  Books:
                    type: array
                    items:
                      type: object
                      properties:
                        book_title: {type: string}
                        user: {type: string}
    post:
      security:
        - bearerAuth: []
      tags: [books]
      summary: Add new book
      description: Add new book
      operationId: api_views.books.add_new_book
      requestBody:
        description: Add new book with title and secret content only available to the user who added it.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                book_title: {type: string, example: 'book99'}
                secret: {type: string, example: 'pass1secret'}
      responses:
        '200':
          description: Successfully added a book
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: {type: string}
                  status: {type: string, enum: ['success', 'fail']}
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
  /books/v1/{book_title}:
    get:
      security:
        - bearerAuth: []
      tags: [books]
      summary: Retrieves book by title along with secret
      description: Retrieves book by title along with secret. Only the owner may retrieve it
      operationId: api_views.books.get_by_title
      parameters:
        - name: book_title
          in: path
          description: retrieve book data
          required: true
          schema: {type: string, example: 'bookTitle77'}
      responses:
        '200':
          description: Successfully retrieve book info
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    book_title: {type: string, example: 'bookTitle77'}
                    owner: {type: string, example: 'name1'}
                    secret: {type: string, example: 'secret for bookTitle77'}
        '401':
          description: User not authorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: ['fail']}
                  message: {type: string}
